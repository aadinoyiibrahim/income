[project]
name = "income-forecast"
version = "2.0.0"
description = "Forecast users' next-month income and expenses (with category breakdowns) from bank transactions."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Abdullahi Adinoyi Ibrahim" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.30",
    "xgboost>=2.1",
]

[project.optional-dependencies]
# Needed to (re)train models. Not installed in the serving image.
train = ["optuna>=4.0"]
# EDA, figures and the notebook.
analysis = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "scipy>=1.13",
    "seaborn>=0.13",
    "shap>=0.46",
]

[project.scripts]
income = "src.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = ["src/old"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/old", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "B905", "E501"]  # FastAPI File(...) defaults; zip() without strict=
