name: Production Pipeline

# Trigger the pipeline on push to main or pull requests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Quality Assurance (Linting & Testing)
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install app deps
          pip install -r requirements.txt
          # Install dev deps (for testing/linting only)
          pip install pytest httpx flake8

      - name: Lint with Flake8
        # Stop the build if there are Python syntax errors or undefined names
        # This ensures code quality standards
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings (optional: remove --exit-zero to enforce style)
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests
        # This runs any tests inside the /tests folder
        run: |
          pytest

  # JOB 2: Build and Deliver (Docker)
  # Only runs if 'test-and-lint' passes
  build-image:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t income-predictor:${{ github.sha }} .
      
