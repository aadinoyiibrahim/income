name: Income and Expenses Prediction Pipeline API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' 

      - name: Install Dependencies (including pytest)
        # We assume pytest is listed in requirements.txt (it should be) or install it explicitly here
        run: |
          pip install -r requirements.txt
          pip install pytest # Ensure pytest is available even if not in a dev-only requirements file

      - name: Run Unit and Integration Tests
        # This command runs all tests we wrote in the 'tests/' directory
        run: |
          # Create dummy directories needed by conftest.py's setup_test_environment
          mkdir -p data models result
          pytest tests/

      - name: Run Linting (Optional but Recommended)
        continue-on-error: true
        run: |
          pip install flake8
          flake8 src/ tests/

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/income-predictor:latest
          
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production 
    steps:
      - name: Deploy to Cloud/Server (Placeholder)
        run: |
          echo "Deployment initiated. Pulling image ${{ secrets.DOCKER_USERNAME }}/income-predictor:latest"
