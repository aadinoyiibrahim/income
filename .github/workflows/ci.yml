name: CI

# Runs on pull requests; on pushes to main it runs as part of release.yml.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        run: uv sync --frozen --extra train
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing

  docker-smoke:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: income-forecast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health + real prediction)
        run: |
          docker run -d --name api -p 8000:8000 income-forecast:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health | grep -q '"model_loaded":true'
          curl -fs -F "file=@data/examples/sample_users.csv" localhost:8000/predict \
            | python -c "import json,sys; b=json.load(sys.stdin); assert b['n_users']>0, b; print(b['forecast_month'], b['n_users'])"
      - if: failure()
        run: docker logs api
